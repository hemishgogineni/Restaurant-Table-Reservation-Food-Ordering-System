<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gourmet Reserve - Login</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login-cosmic.css">
  
  <script>
    document.documentElement.classList.add('preload');
  </script>
</head>
<body>
  <!-- Galaxy Background Canvas -->
  <canvas id="galaxy-canvas" class="galaxy-canvas"></canvas>

  <!-- Navigation -->
  <nav class="navbar-cosmic">
    <div class="navbar-brand">
      <div class="brand-icon">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <span>Gourmet Reserve</span>
    </div>
    
    <div class="navbar-actions">
      <a href="#signup" class="navbar-link">Sign Up</a>
    </div>
  </nav>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
      </div>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="your.email@christ.edu"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••"
              required
            >
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">
          <i class="fa-solid fa-arrow-right"></i>
          Sign In
        </button>
      </form>

      <div class="divider">Demo Credentials</div>

      <div class="demo-cards">
        <div class="demo-card" onclick="fillDemoCredentials('customer@christ.edu', 'password123')">
          <div class="demo-icon customer">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="demo-info">
            <h4>Customer</h4>
            <small>customer@christ.edu</small>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="demo-card" onclick="fillDemoCredentials('kitchen@christ.edu', 'password123')">
          <div class="demo-icon kitchen">
            <i class="fa-solid fa-kitchen-set"></i>
          </div>
          <div class="demo-info">
            <h4>Kitchen Staff</h4>
            <small>kitchen@christ.edu</small>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="demo-card" onclick="fillDemoCredentials('admin@christ.edu', 'password123')">
          <div class="demo-icon admin">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <div class="demo-info">
            <h4>Manager</h4>
            <small>admin@christ.edu</small>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/galaxy-background.js"></script>
  <script>
    // Remove preload class after initial paint
    window.addEventListener('load', () => {
      document.documentElement.classList.remove('preload');
    });

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const btn = document.querySelector('.password-toggle');
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
    }

    function fillDemoCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('password').type = 'password';
      document.querySelector('.password-toggle').innerHTML = '<i class="fa-solid fa-eye"></i>';
      showToast(`Filled credentials for ${email.split('@')[0]}`, 'info');
    }

    async function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      showToast('Logging in...', 'info');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Invalid email or password');
        }

        localStorage.setItem('authToken', result.data.token);
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userRole', email.includes('kitchen') ? 'kitchen' : email.includes('admin') ? 'admin' : 'customer');
        showToast('Welcome back! Redirecting...', 'success');
        setTimeout(() => { window.location.href = '/'; }, 500);
      } catch (error) {
        showToast(error.message || 'Unable to log in', 'error');
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <i class="fa-solid fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('show');
      }, 10);

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
